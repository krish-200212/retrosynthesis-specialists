name: retrosynthesis_specialists
version: "0.7.0"
manifest_version: 2
api_version: 1
description: "Default parallel retrosynthesis workflow with an independent literature route proposer, stereochemical plans and checked final selection."
provides_tools:
  - start_retrosynthesis_workflow
  - retrosynthesis_workflow_status
  - read_retrosynthesis_task
  - inspect_target_stereochemistry
  - search_route_literature
  - validate_route_hypotheses
  - verify_retrosynthesis_result
  - accept_retrosynthesis_result
  - accept_specialist_retrosynthesis_result
provides_hooks:
  - pre_tool_call
config_schema:
  enabled:
    type: bool
    default: false
    description: "Enable this profile's primitive tools after configuring the analysis interpreter."
  backend_python:
    type: str
    required: true
    description: "Absolute existing Python interpreter with RDKit and the project's dependencies."
  backend_library_paths:
    type: list
    default: []
    description: "Trusted absolute package directories for isolated Python; no model-controlled paths."
  backend_timeout_seconds:
    type: float
    default: 45
    description: "Bounded primitive call deadline, 1–120 seconds."
  inventory_file:
    type: str
    default: ""
    description: "Trusted JSON inventory containing molecules and source identity; empty means unknown stock."
  quotes_file:
    type: str
    default: ""
    description: "Trusted JSON sourced price records; empty means unknown cost."
  cost_assumptions:
    type: dict
    default: {}
    description: "Operator-owned quantity/yield assumptions; never generated by a specialist."
  backend_max_output_bytes:
    type: int
    default: 4000000
    description: "Combined stdout/stderr byte cap enforced while the worker runs."
  baseline_file:
    type: str
    default: ""
    description: "Trusted JSON {source, routes} from tool output; required for verified tool-baseline cost comparisons."
  baseline_sha256:
    type: str
    default: ""
    description: "Exact SHA-256 of the configured baseline artifact; model-provided baselines must match its graphs."
  literature_timeout_seconds:
    type: float
    default: 30
    description: "Literature retrieval deadline, positive and at most30 seconds, strictly below backend_timeout_seconds."
  literature_include_fulltext:
    type: bool
    default: true
    description: "Attempt bounded primary full-text context retrieval when Europe PMC exposes it."
  literature_context_chars:
    type: int
    default: 6000
    description: "Aggregate excerpt budget, 500–12000 characters."
  literature_cache_seconds:
    type: float
    default: 86400
    description: "Trusted query cache freshness limit, 0–604800 seconds; stale fallback is explicitly labeled."
  literature_fulltext_timeout_seconds:
    type: float
    default: 8
    description: "Full-text phase timeout within the total literature budget, up to15 seconds."

  pipeline_config_file:
    type: str
    default: ""
    description: "Operator-owned workflow configuration template. Empty disables workflow submission."
  workflow_specialist_name:
    type: str
    default: ""
    description: "Owner-only: reviewed installed specialist name. The package installer sets this after owner approval; Main inherits its active conversation model and profile for every workflow."
  pipeline_runner_file:
    type: str
    default: ""
    description: "Absolute trusted run_pipeline.py deployment file; never a model argument."
  pipeline_runner_sha256:
    type: str
    default: ""
    description: "Exact runner file digest required before workflow admission."
